name: Build release binaries

on:
  workflow_call:

jobs:
  sdist:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@main
        with:
          toolchain: nightly
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Build sdist
        run: uv build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist/*.tar.gz

  build-wheels:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-2025-vs2026, macos-26, macos-26-intel]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        env:
          ADG_MULTIPLE_TARGET: "true"
          CIBW_ENVIRONMENT_PASS_LINUX: ADG_MULTIPLE_TARGET
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.runner }}
          path: ./wheelhouse/*.whl
