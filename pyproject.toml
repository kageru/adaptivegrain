[project]
name = "vapoursynth-adaptivegrain"
version = "0.4.0"
description = "adaptivegrain filter as a VapourSynth plugin."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE.md"]

dependencies = ["vapoursynth>=74"]

[build-system]
requires = ["hatchling==1.29.0", "packaging==26.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["vapoursynth/plugins/adaptivegrain"]
artifacts = [
    "vapoursynth/plugins/adaptivegrain/*.dylib",
    "vapoursynth/plugins/adaptivegrain/*.so",
    "vapoursynth/plugins/adaptivegrain/*.dll",
    "vapoursynth/plugins/adaptivegrain/manifest.vs",
]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.cibuildwheel]
skip = [
    "*-musllinux_i686",   # Rust does not provide Cargo for musllinux 32-bit.
    "*-musllinux_x86_64", # musllinux 64-bit does not support cdylib.
]

[tool.cibuildwheel.macos.environment]
# Rust's minimum macOS target is 10.12.
MACOSX_DEPLOYMENT_TARGET = "10.12"

[project.urls]
Homepage = "https://github.com/kageru/adaptivegrain"
